<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <section id="join">
      <h2 class="section-title">Register & Join</h2>

      <form id="reg-form" class="reg-form">
        <div class="form-group">
          <label for="name">Real Name *</label>
          <input type="text" id="name" name="name" required placeholder="John Doe" />
        </div>

        <div class="form-group">
          <label for="ign">In-Game Name (IGN) *</label>
          <input type="text" id="ign" name="IGN" required placeholder="e.g. TK_Slayer" />
        </div>

        <div class="form-group">
          <label for="uid">UID *</label>
          <input type="text" id="uid" name="UID" required placeholder="e.g. 6712345678901234"/>
        </div>

        <div class="form-group">
          <label for="streamerId">Streamer Mode ID *</label>
          <input
    type="text" id="streamerId" name="streamerId" required placeholder="e.g. a8f921d0"/>
        </div>

        <div class="form-group">
          <label for="gameProfileImg"> Screenshot of In-Game Profile * </label>

          <input type="file" name="inGProfile" id="inGProfile" accept="image/*" />
        </div>

        <div class="form-group">
          <label for="fbProfileImg"> Screenshot of FB Profile * </label>

          <input type="file" name="fbProfile" id="fbProfile" accept="image/*"/>
        </div>

        <div class="form-group">
          <label for="fbLink">FB Link *</label>

          <input name="FB" id="FB"
            type="url"
            required
            placeholder="https://facebook.com/yourprofile"
          />
        </div>

        <div class="form-group">
          <label for="role">Preferred Role</label>

          <select id="role" name="role">
            <option value="Streamer">Streamer</option>
            <option value="Casual">Casual</option>
            <option value="Competitive">Competitive</option>
          </select>
        </div>

        <button type="submit" class="btn submit-btn">Submit Application</button>
      </form>
    </section>
        <p id="messageElement"></p>
    <script src="form.js"></script>
</body>
</html>
